spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/trustpay_dev
    username: ${POSTGRES_USER:trustpay}
    password: ${POSTGRES_PASSWORD:trustpay123}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# New Core Security Configurations added here
security:
  jwt:
    secret: TrustPayProSecureCryptographicSecretKey2026SigningTokenEngineKeySecureString
    expiration-ms: 3600000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs