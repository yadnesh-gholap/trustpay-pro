

services:
  postgres:
    image: postgres:16
    container_name: trustpay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trustpay_dev
      POSTGRES_USER: trustpay
      POSTGRES_PASSWORD: trustpay123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustpay -d trustpay_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: